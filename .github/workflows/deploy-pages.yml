name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Configure base path
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          base_path="${PAGES_BASE_PATH:-/}"
          [[ "$base_path" == /* ]] || base_path="/$base_path"
          [[ "$base_path" == */ ]] || base_path="$base_path/"
          echo "VITE_BASE_PATH=$base_path" >> "$GITHUB_ENV"
          echo "Building for GitHub Pages base path: $base_path"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify Pages build
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const base = process.env.VITE_BASE_PATH
          const html = fs.readFileSync('dist/index.html', 'utf8')
          const files = fs
            .readdirSync('dist/assets')
            .filter((file) => file.endsWith('.js') || file.endsWith('.css'))
            .map((file) => fs.readFileSync(path.join('dist/assets', file), 'utf8'))
            .join('\n')
          const output = `${html}\n${files}`
          const entryUrls = [...html.matchAll(/\b(?:src|href)="([^"]+)"/g)].map((match) => match[1])
          const requiredEntries = ['.js', '.css']

          for (const extension of requiredEntries) {
            const url = entryUrls.find((entry) => entry.startsWith(base) && entry.endsWith(extension))
            if (!url) throw new Error(`Missing ${extension} entry under Pages base path ${base}`)

            const relativePath = url.slice(base.length)
            if (!fs.existsSync(path.join('dist', relativePath))) {
              throw new Error(`Referenced build file does not exist: ${url}`)
            }
          }

          const requiredBinaryAssets = [
            'fonts/font-awesome-solid.woff2',
            'fonts/inter.woff2',
            'fonts/open-sans.woff2',
            'assets/masters/anna.jpg',
            'assets/masters/arina.jpg',
            'assets/masters/elena.jpg',
            'assets/masters/igor.jpg',
            'assets/masters/nikita.jpg',
            'assets/masters/sofia.jpg',
          ]

          for (const relativePath of requiredBinaryAssets) {
            const filePath = path.join('dist', relativePath)
            if (!fs.existsSync(filePath)) {
              throw new Error(`Required binary asset does not exist: ${base}${relativePath}`)
            }
            if (fs.statSync(filePath).size < 1024) {
              throw new Error(`Binary asset is unexpectedly small (Git LFS pointer?): ${base}${relativePath}`)
            }
          }

          if (!output.includes(`${base}favicon`)) {
            throw new Error(`Build output does not use ${base}favicon`)
          }

          const rootAbsolute = output.match(/["'(]\/(?:assets|fonts|favicon)(?:\/|\.|["')])/g)
          if (base !== '/' && rootAbsolute) {
            throw new Error(`Found paths that bypass the Pages base path: ${rootAbsolute.slice(0, 5).join(', ')}`)
          }

          if (!fs.existsSync('dist/.nojekyll')) {
            throw new Error('dist/.nojekyll is missing')
          }

          console.log(`Verified GitHub Pages build for ${base}`)
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
